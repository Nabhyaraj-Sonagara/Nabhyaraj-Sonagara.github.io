<title>Nabhyaraj Site Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap">
<style>
/* Layout: an ink toolbar on top, the real site in a frame underneath, drawers slide over the frame.
   The editor chrome keeps the Kinetic dark look in both themes; the site inside follows its own toggle. */
:root {
  --ink: #0e0e0c; --raise: #1a1a17; --line: #34342d; --paper: #f4f1ea; --dim: #a19d92;
  --lime: #d7ff3d; --signal: #ff5b2e;
  --f-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--f-body); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

.bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--ink); position: relative; z-index: 5; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; margin-right: 4px; white-space: nowrap; }
.brand i { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px rgba(215, 255, 61, .16); }
.pick { position: relative; min-width: 0; }
.pick select { appearance: none; background: var(--raise); border: 1px solid var(--line); border-radius: 999px; height: 34px; padding: 0 34px 0 14px; max-width: 260px; text-overflow: ellipsis; }
.pick::after { content: "▾"; position: absolute; right: 13px; top: 50%; transform: translateY(-52%); color: var(--dim); pointer-events: none; font-size: 12px; }
.seg { display: inline-flex; background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; height: 26px; padding: 0 13px; border-radius: 999px; color: var(--dim); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--lime); color: var(--ink); }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; height: 34px; padding: 0 14px; color: var(--paper); white-space: nowrap; }
.ghost:hover { border-color: var(--dim); }
.spacer { flex: 1 1 0; }
.count { font-family: var(--f-mono); font-size: 12px; letter-spacing: .02em; }
.count b { font-weight: 600; }
.count .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); margin-right: 7px; vertical-align: 1px; }
.count[data-state="dirty"] .dot { background: var(--signal); box-shadow: 0 0 0 3px rgba(255, 91, 46, .2); }
.count[data-state="saved"] .dot { background: var(--lime); }
.save { border: 0; border-radius: 999px; height: 34px; padding: 0 18px; background: var(--signal); color: var(--ink); font-weight: 700; white-space: nowrap; }
.save:disabled { background: var(--raise); color: var(--dim); cursor: default; }

.stage { flex: 1 1 auto; position: relative; min-height: 0; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--ink); }

.hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 3; background: rgba(14, 14, 12, .92); border: 1px solid var(--line); color: var(--paper); border-radius: 999px; padding: 8px 16px; font-size: 13px; white-space: nowrap; pointer-events: none; transition: opacity .4s; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.hint.off { opacity: 0; }

.toast { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; max-width: min(520px, calc(100% - 32px)); background: var(--paper); color: var(--ink); border-radius: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.4; box-shadow: 0 12px 32px rgba(0, 0, 0, .35); }
.toast.bad { background: var(--signal); }
.drawer[hidden], .toast[hidden] { display: none; }

.drawer { position: absolute; top: 0; right: 0; bottom: 0; z-index: 4; width: min(460px, 100%); background: var(--ink); border-left: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: -18px 0 40px rgba(0, 0, 0, .35); }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer h2 { margin: 0; font-family: var(--f-display); font-size: 20px; font-weight: 700; letter-spacing: -.01em; flex: 1; }
.drawer .x { background: none; border: 1px solid var(--line); border-radius: 50%; width: 32px; height: 32px; color: var(--paper); }
.drawer .body { overflow-y: auto; padding: 14px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.drawer p.note { margin: 0; color: var(--dim); line-height: 1.5; }
.edit-item { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--raise); }
.edit-item .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-family: var(--f-mono); font-size: 11px; color: var(--dim); letter-spacing: .02em; text-transform: uppercase; }
.edit-item .meta .new { color: var(--signal); }
.edit-item .was { color: var(--dim); text-decoration: line-through; text-decoration-color: rgba(161, 157, 146, .6); line-height: 1.45; overflow-wrap: anywhere; }
.edit-item .now { line-height: 1.45; overflow-wrap: anywhere; }
.edit-item .now:empty::before { content: "(left empty)"; color: var(--dim); font-style: italic; }
.edit-item .acts { display: flex; gap: 8px; }
.edit-item .acts button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--paper); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
.field textarea { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; line-height: 1.45; resize: vertical; min-height: 44px; }
.field .sub { font-size: 12px; color: var(--dim); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 720px) {
  .brand span { display: none; }
  .pick select { max-width: 46vw; }
  .ghost.meta-btn { display: none; }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<div class="bar" role="toolbar" aria-label="Editor">
  <div class="brand"><i aria-hidden="true"></i><span>Site editor</span></div>
  <div class="pick"><select id="ed-page" aria-label="Page"></select></div>
  <div class="seg" role="group" aria-label="Mode">
    <button type="button" id="ed-mode-edit" aria-pressed="true">Edit</button>
    <button type="button" id="ed-mode-browse" aria-pressed="false">Browse</button>
  </div>
  <button type="button" class="ghost meta-btn" id="ed-meta">Title &amp; description</button>
  <div class="spacer"></div>
  <button type="button" class="ghost count" id="ed-count" data-state="clean"><span class="dot" aria-hidden="true"></span><span id="ed-count-text">No changes yet</span></button>
  <button type="button" class="save" id="ed-save" disabled>Save</button>
</div>

<div class="stage">
  <iframe id="ed-frame" title="Site preview"></iframe>
  <div class="hint" id="ed-hint">Click any text to change it. Enter keeps it, Esc undoes it.</div>
  <div class="toast" id="ed-toast" role="status" hidden></div>

  <aside class="drawer" id="ed-review" aria-label="Changes" hidden>
    <header><h2>Changes</h2><button type="button" class="x" data-close aria-label="Close">✕</button></header>
    <div class="body" id="ed-review-body"></div>
  </aside>

  <aside class="drawer" id="ed-metap" aria-label="Title and description" hidden>
    <header><h2>Title &amp; description</h2><button type="button" class="x" data-close aria-label="Close">✕</button></header>
    <div class="body">
      <p class="note">What shows in the browser tab and in search results for this page. Pages that share a description change together.</p>
      <div class="field"><label for="ed-title">Title</label><textarea id="ed-title" rows="2"></textarea></div>
      <div class="field"><label for="ed-desc">Description</label><textarea id="ed-desc" rows="5"></textarea><span class="sub" id="ed-desc-sub"></span></div>
      <div class="row-btns"><button type="button" class="save" id="ed-meta-keep">Keep</button></div>
    </div>
  </aside>
</div>

<script type="application/json" id="ed-data">__DATA__</script>
<script>
__ENGINE__
</script>
